version: '3.8'

services:
  # Computer Use Agent Backend API
  api:
    build: .
    container_name: computer_use_api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DATABASE_URL_ASYNC=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - VNC_HOST=vnc
      - VNC_PORT=5900
      - VNC_PASSWORD=${VNC_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      vnc:
        condition: service_started
    networks:
      - computer_use_network
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: computer_use_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - computer_use_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # VNC Desktop Environment
  vnc:
    image: ghcr.io/linuxserver/webtop:ubuntu-xfce
    container_name: computer_use_vnc
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SUBFOLDER=/
      - TITLE=Computer Use Desktop
    volumes:
      - vnc_config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3000:3000"  # Web interface
      - "6080:6080"  # VNC viewer
    shm_size: "1gb"
    networks:
      - computer_use_network
    restart: unless-stopped

  # Frontend Demo (Simple)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: computer_use_frontend
    ports:
      - "3001:80"
    environment:
      - API_BASE_URL=http://localhost:8000
      - WS_BASE_URL=ws://localhost:8000
    depends_on:
      - api
    networks:
      - computer_use_network
    restart: unless-stopped

  # Redis (Optional, for scaling)
  redis:
    image: redis:7-alpine
    container_name: computer_use_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - computer_use_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: computer_use_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - computer_use_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  vnc_config:
    driver: local
  redis_data:
    driver: local

networks:
  computer_use_network:
    driver: bridge